spring:
  application:
    name: portfolio-java
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      uri: ${MONGO_URL:mongodb://localhost:27017/api-portfolio-v2}
      auto-index-creation: true

server:
  port: ${PORT:3333}
  servlet:
    context-path: /

portfolio:
  cors:
    allowed-origins: ${ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173,https://gabrielfeijo.com.br,https://www.gabrielfeijo.com.br}
  security:
    admin-api-key: ${ADMIN_API_KEY:your_secure_admin_api_key_here}
    swagger-user: ${SWAGGER_USER:admin}
    swagger-password: ${SWAGGER_PASSWORD:admin_password_here}
    swagger-enabled: ${SWAGGER_ENABLED:true}
  discord:
    webhook-url: ${DISCORD_WEBHOOK_URL:}
    enabled: ${DISCORD_WEBHOOK_ENABLED:false}

springdoc:
  api-docs:
    path: /v2/api-docs
    enabled: ${portfolio.security.swagger-enabled}
  swagger-ui:
    path: /swagger
    enabled: ${portfolio.security.swagger-enabled}
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
